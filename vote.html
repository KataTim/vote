<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>参与投票 · VoteZone 2000</title>
<link rel="stylesheet" href="https://unpkg.com/98.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="page-wrap">

  <div class="site-banner">
    <div class="site-banner__inner">
      <h1>★ VoteZone 2000 ★</h1>
      <p><a href="index.html">← 返回首页</a></p>
    </div>
  </div>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">🗔 VoteZone.exe - 投票详情</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="toolbar" id="toolbar"><span>正在加载登录状态...</span></div>
  </div>

  <div class="window">
    <div class="title-bar">
      <div class="title-bar-text">🗳 投票详情</div>
    </div>
    <div class="window-body">
      <div id="poll-msg" class="info-box">正在读取投票信息...</div>

      <div id="poll-content" style="display:none;">
        <h2 id="poll-title" style="margin-bottom:2px;"></h2>
        <p id="poll-desc" style="color:#444; font-size:12px;"></p>
        <p style="font-size:12px;">
          <span class="badge" id="poll-status-badge"></span>
          &nbsp; 开始：<span id="poll-start"></span>
          &nbsp; | 结束：<span id="poll-end"></span>
        </p>

        <div class="sunken-panel mt8" style="padding:8px;">
          <div id="vote-notice" class="info-box" style="display:none;"></div>
          <div id="vote-error" class="error-box" style="display:none;"></div>
          <div id="vote-success" class="success-box" style="display:none;"></div>

          <form id="vote-form" style="display:none;">
            <div id="options-container"></div>
            <div class="mt12">
              <button type="submit" id="vote-submit">提交投票</button>
            </div>
          </form>
        </div>

        <div id="results-section" class="mt12" style="display:none;">
          <fieldset>
            <legend>📊 投票结果</legend>
            <div id="results-container"></div>
          </fieldset>
        </div>
      </div>
    </div>
  </div>

  <footer class="status-bar">
    <p class="status-bar-field">状态：就绪</p>
    <p class="status-bar-field">VoteZone 2000</p>
  </footer>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/vote.js"></script>
</body>
</html>
